version: '3.8'

services:
  redis:
    image: redis:alpine
    #container_name: ddos_redis
    networks:
      - ddos_net

#  pop_setup:
#    build: .
#    #container_name: ddos_pop_setup
#    command: python pop_setup.py
#    environment:
#      - REDIS_HOST=redis
#    depends_on:
#      - redis
#    networks:
#      - ddos_net
#    restart: "no"

  pop_lb:
    build: .
    #container_name: ddos_pop
    command: python main.py
    ports:
      - "8085-8090:80"
    environment:
      - POP_PORT=80
      - REDIS_HOST=redis
      - GLOBAL_DNS_REDIS=redis_mycloud
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    networks:
      - ddos_net
      - mycloud_global_net

  waf_node:
    build: .
    command: python waf.py 8000
    restart: always
    #restart: "no"
    environment:
      - REDIS_HOST=redis
      - WAF_FLOOD_WINDOW=1
      - WAF_FLOOD_MAX_REQS=50
      - WAF_BAN_TIMEOUT=15 #pune pe 30
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    networks:
      - ddos_net
      - mycloud_global_net


networks:
  ddos_net:
    driver: bridge
  mycloud_global_net:
    external: true